# Builds the OpenUSD + MaterialX WASM SDK and the usd-wg-webview bindings on top
# of it, from the pinned submodules in external/.
#
# Runs on demand, and on every tag push (a cold build takes hours; it must
# never fire on an ordinary push to a branch). A tag push carries no
# workflow_dispatch inputs, so every ${{ inputs.* }} use below is resolved
# through the job-level env block instead, which falls back to the same
# defaults declared here.
name: build-wasm-bindings

on:
  workflow_dispatch:
    inputs:
      skip_materialx:
        description: "Build USD without MaterialX (faster, breaks .mtlx layer references)"
        type: boolean
        default: false
      emsdk_version:
        description: "emsdk version to install and activate"
        type: string
        default: "latest"
      sdk_cache_bust:
        description: "Rebuild the SDK from scratch and replace the cached one"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350          # under the 6 hour hard cap, so logs survive
    permissions:
      contents: read
      actions: write              # to drop the SDK cache entry on a forced rebuild
    env:
      # workflow_dispatch inputs are undefined on a tag push, so every input
      # is read through these instead, which fall back to the same defaults
      # declared on workflow_dispatch above.
      SKIP_MATERIALX: ${{ inputs.skip_materialx || false }}
      EMSDK_VERSION: ${{ inputs.emsdk_version || 'latest' }}
      SDK_CACHE_BUST: ${{ inputs.sdk_cache_bust || false }}

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Record pinned revisions
        run: |
          {
            echo "### Pinned sources"
            echo ""
            echo "| submodule | revision |"
            echo "|---|---|"
            for m in openusd materialx usd-wg-webview; do
              echo "| $m | \`$(git -C external/$m rev-parse HEAD)\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # Keyed on the SDK inputs only. The webview pin and build.py are left out on
      # purpose: bindings changes must not throw away a 34 minute USD build, which
      # is the whole point. Change sdk_cache_bust when the SDK build flags change.
      - name: Compute SDK cache key
        id: sdkkey
        run: |
          sdk="$(python3 build.py --sdk-fingerprint)"
          digest="$(printf 'mtlx=%s|emsdk=%s' "$SKIP_MATERIALX" "$EMSDK_VERSION" | sha256sum | cut -c1-8)"
          key="usdsdk-${{ runner.os }}-$sdk-$digest"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "SDK cache key: $key"

      - name: Disk before cleanup
        run: |
          {
            echo ""
            echo "### Runner"
            echo ""
            echo '```'
            df -h /
            echo "nproc=$(nproc)  ram=$(free -g | awk '/^Mem:/{print $2}')GB"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The image ships tens of GB of toolchains we do not need. Whether this is
      # the difference between fitting and not is one of the things we measure.
      - name: Free disk space
        run: |
          before=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/powershell /usr/share/swift || true
          sudo docker image prune --all --force || true
          sudo apt-get clean
          after=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          {
            echo ""
            echo "Disk freed: ${before}G available -> ${after}G available"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake ccache
          cmake --version | head -1

      # Split like the others: a plain cache step does not save when the job
      # fails, which would re-download and re-install emsdk on every failed run.
      - name: Restore emsdk
        id: emsdkcache
        uses: actions/cache/restore@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}

      - name: Set up emsdk
        run: |
          if [ ! -d "$HOME/emsdk/.git" ]; then
            git clone https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          fi
          cd "$HOME/emsdk"
          ./emsdk install "$EMSDK_VERSION"
          ./emsdk activate "$EMSDK_VERSION"
          . ./emsdk_env.sh
          {
            echo ""
            echo "emcc: \`$(emcc --version | head -1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # One step: emsdk_env.sh only affects the shell that sourced it. The disk
      # watcher runs alongside so running out of space is distinguishable from a
      # compile failure in the log.
      - name: Save emsdk
        if: steps.emsdkcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}

      # ccache is content addressed, so an older cache is always safe to reuse:
      # a changed source simply misses. That makes restore-keys correct here,
      # unlike the SDK cache, where a partial match would be wrong.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Configure ccache
        run: |
          # The repo shares a 10GB cache budget with emsdk and the SDK prefix,
          # and the SDK cache is the expensive one to lose. Keep this modest.
          ccache -M 2G
          ccache -z
          ccache --version | head -1

      # Cache entries are immutable, so a forced rebuild has to delete the old one
      # or it could never be saved under the same key. Skipping the restore alone
      # would rebuild for this run only and leave the stale entry in place.
      - name: Drop cached SDK
        if: env.SDK_CACHE_BUST == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache delete "${{ steps.sdkkey.outputs.key }}" || echo "nothing cached under that key"

      - name: Restore SDK cache
        id: sdkcache
        if: env.SDK_CACHE_BUST != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/usdwasm/install
            ~/usdwasm/.phases
          key: ${{ steps.sdkkey.outputs.key }}

      # The SDK cache carries the phase markers. The bindings marker must never
      # survive a restore: build.py would skip the phase, emit no module, and
      # the patches it applies would never run.
      - name: Force the bindings phase
        run: |
          rm -rf "$HOME/usdwasm/.phases/bindings" "$HOME/usdwasm/out"
          echo "markers kept:"
          ls -1 "$HOME/usdwasm/.phases" 2>/dev/null || echo "(none)"

      - name: Build SDK and bindings
        id: build
        env:
          EM_COMPILER_WRAPPER: ccache
          # Restoring emsdk and the SDK from cache resets every mtime, so the
          # default mtime based checks would miss on essentially everything.
          # Hashing content instead is both more correct and far more reusable.
          CCACHE_COMPILERCHECK: content
          CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime,locale
          CCACHE_BASEDIR: ${{ github.workspace }}
        run: |
          . "$HOME/emsdk/emsdk_env.sh"
          ( while sleep 120; do echo "[disk] $(df -h / | tail -1)"; done ) &
          watcher=$!
          set +e
          extra_args=()
          [ "$SKIP_MATERIALX" = "true" ] && extra_args+=(--skip-materialx)
          python3 build.py --root "$HOME/usdwasm" -j "$(nproc)" "${extra_args[@]}"
          code=$?
          set -e
          kill $watcher 2>/dev/null || true
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      # Only reached when the build step above exited 0. Exercises the actual
      # patch fixes against the module the job just produced.
      - name: Run fixtures
        run: |
          out="$HOME/usdwasm/out"
          for fixture in tests/*.mjs; do
            echo "== $fixture =="
            node "$fixture" "$out"
          done

      # Guards against the module silently coming back as a dynamically
      # linked side module, which loads under Node but not in the browser.
      - name: Check wasm is statically linked
        run: node scripts/check-wasm-imports.mjs "$HOME/usdwasm/out"

      # build_usd.py puts its download and build trees INSIDE the install prefix,
      # which is most of its size and is never needed again once the phase marker
      # says the SDK is done. Runner-only, nothing outside ~/usdwasm is touched.
      - name: Prepare SDK cache
        id: sdkprep
        if: always()
        run: |
          rm -rf "$HOME/usdwasm/install/build" "$HOME/usdwasm/install/src" "$HOME/usdwasm/build/materialx" || true
          rm -f "$HOME/usdwasm/.phases/bindings"
          if [ -f "$HOME/usdwasm/.phases/usd" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "sdk cache candidate: $(du -sh "$HOME/usdwasm/install" | cut -f1)"
          fi

      # Saved even when the bindings step failed: that is exactly the case worth
      # caching. Split restore/save because actions/cache does not save on failure.
      - name: Save SDK cache
        if: always() && steps.sdkprep.outputs.ok == 'true' && steps.sdkcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/usdwasm/install
            ~/usdwasm/.phases
          key: ${{ steps.sdkkey.outputs.key }}

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.run_id }}

      - name: Result
        if: always()
        run: |
          out="$HOME/usdwasm/out"
          {
            echo ""
            echo "### Result"
            echo ""
            echo "| item | value |"
            echo "|---|---|"
            echo "| exit code | ${{ steps.build.outputs.exit_code || 'failed before build' }} |"
            echo "| SDK cache | ${{ steps.sdkcache.outputs.cache-hit == 'true' && 'reused' || 'built fresh' }} |"
            echo "| ccache | $(ccache -s 2>/dev/null | awk -F': *' '/[Hh]its/{print $2; exit}') hits |"
            if [ -f "$out/usdWebViewBindingsModule.wasm" ]; then
              echo "| wasm bytes | $(stat -c%s "$out/usdWebViewBindingsModule.wasm") (upstream ships 19733084) |"
            else
              echo "| wasm | MISSING |"
            fi
            if [ -f "$HOME/usdwasm/install/lib/libusd_usdMtlx.a" ]; then
              echo "| MaterialX in USD | yes |"
            else
              echo "| MaterialX in USD | no |"
            fi
            echo "| tree size | $(du -sh "$HOME/usdwasm" 2>/dev/null | cut -f1) |"
            echo "| disk remaining | $(df -h / | tail -1 | awk '{print $4}') |"
          } >> "$GITHUB_STEP_SUMMARY"

      # When it fails, the first compile errors are the entire point: put them in
      # the summary so the answer is readable without downloading anything.
      - name: First errors
        if: failure()
        run: |
          {
            echo ""
            echo "### First compile errors"
            echo '```'
            grep -hE "error:|fatal error:|No such file or directory" \
              "$HOME/usdwasm/logs/"*.log 2>/dev/null | head -40 || echo "(none found in logs)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Artifact storage is small, so keep the ~20MB module and the logs only,
      # never the multi-GB SDK.
      - name: Upload bindings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usd-webview-bindings-wasm
          path: ~/usdwasm/out/
          if-no-files-found: error
          retention-days: 14

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ~/usdwasm/logs/
          if-no-files-found: warn
          retention-days: 14

  # Only for a tag push. Publishes the module the build job just produced,
  # plus the upstream JS wrapper usdWebViewBindings.js (that file is not part
  # of build.py's output; it is maintained by usd-wg-webview and lives at
  # external/usd-wg-webview/public/usd-webview-bindings/usdWebViewBindings.js),
  # a checksum manifest, and a licence bundle, so MaterialX Playground's
  # scripts/vendor.mjs can pin the release by URL and sha256 like every other
  # download it fetches.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download bindings artifact
        uses: actions/download-artifact@v4
        with:
          name: usd-webview-bindings-wasm
          path: dist

      - name: Assemble release assets
        run: |
          set -euo pipefail
          mkdir -p release
          cp dist/usdWebViewBindingsModule.js release/
          cp dist/usdWebViewBindingsModule.wasm release/
          cp external/usd-wg-webview/public/usd-webview-bindings/usdWebViewBindings.js release/

          {
            echo "Third-party licences for the USDBindings release ${GITHUB_REF#refs/tags/}"
            echo
            echo "== USDBindings (this repository) =="
            cat LICENSE
            echo
            cat NOTICE
            echo
            echo "== OpenUSD (external/openusd) =="
            cat external/openusd/LICENSE.txt
            echo
            echo "== MaterialX (external/materialx) =="
            cat external/materialx/LICENSE
            echo
            echo "== usd-wg-webview (external/usd-wg-webview) =="
            cat external/usd-wg-webview/LICENSE
          } > release/LICENSES.txt

          ( cd release && sha256sum usdWebViewBindings.js usdWebViewBindingsModule.js usdWebViewBindingsModule.wasm > SHA256SUMS )
          cat release/SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            release/usdWebViewBindings.js \
            release/usdWebViewBindingsModule.js \
            release/usdWebViewBindingsModule.wasm \
            release/SHA256SUMS \
            release/LICENSES.txt \
            --repo "${{ github.repository }}" \
            --title "$tag" \
            --notes "USD + MaterialX WASM bindings built from this tag. Verify downloads against SHA256SUMS."
